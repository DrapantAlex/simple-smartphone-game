<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cairo Vattene</title>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#1c0a0c;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;margin:0 auto}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
// =====================================================================
//  CAIRO VATTENE! — corsa infinita del corteo granata
// =====================================================================
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=640,H=360,GY=300,LEADX=250,JV=-520,G=1500,MAXF=36,GIORNATE=38,GOAL=1000000;
const OUT='#2a1616',GRANATA='#8a1c22',F="'Luckiest Guy', Impact, sans-serif";
let SC=1,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);SC=Math.min(innerWidth/W,innerHeight/H);
 cv.width=Math.round(W*SC*DPR);cv.height=Math.round(H*SC*DPR);cv.style.width=(W*SC)+'px';cv.style.height=(H*SC)+'px';
 cv.style.marginTop=Math.max(0,(innerHeight-H*SC)/2)+'px';}
addEventListener('resize',resize);resize();
const R=(a,b)=>a+Math.random()*(b-a),pick=a=>a[(Math.random()*a.length)|0],clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function shade(hex,a){let c=hex.replace('#','');let n=parseInt(c,16),r=n>>16,g=n>>8&255,b=n&255;
 if(a>0){r+=(255-r)*a;g+=(255-g)*a;b+=(255-b)*a;}else{r*=1+a;g*=1+a;b*=1+a;}return 'rgb('+(r|0)+','+(g|0)+','+(b|0)+')';}
const fmt=n=>Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');

// ---------- audio ----------
let AC=null;
function beep(f,d,type,v){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.value=f;g.gain.value=v||0.04;g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}
function fanfare(){[523,659,784,1047].forEach((n,k)=>setTimeout(()=>beep(n,.15,'sawtooth',.035),k*110));}

// ---------- salvataggio locale ----------
const KEY='cairoVattene.v3';
let save=null;try{save=JSON.parse(localStorage.getItem(KEY));}catch(e){}
if(!save||typeof save!=='object')save={season:1,seasonWins:0,giornata:0,seasonP:0,missionsDone:0,active:[0,1,2],nextM:3,mprog:{},totals:{fans:0,runs:0},best:0};
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}
const seasonTarget=()=>30000+save.seasonWins*12000;

// ---------- missioni e sblocchi ----------
const MT=[
 {s:'m',k:'run',g:500,t:g=>'Percorri '+g+' m in una giornata'},
 {s:'maxCrowd',k:'run',g:12,t:g=>'Porta '+g+' tifosi insieme'},
 {s:'picked',k:'total',g:60,t:g=>'Raccogli '+g+' tifosi in totale'},
 {s:'gates',k:'run',g:1,t:g=>g>1?'Sfonda '+g+' tornelli in una giornata':'Sfonda un tornello'},
 {s:'smokes',k:'run',g:1,t:g=>g>1?'Accendi '+g+' fumogeni in una giornata':'Accendi un fumogeno'},
 {s:'heliWin',k:'run',g:1,t:g=>g>1?'Respingi '+g+' volte l\'elicottero':'Respingi l\'elicottero di Cairo'},
 {s:'m',k:'run',g:1200,t:g=>'Percorri '+g+' m in una giornata'},
 {s:'maxCrowd',k:'run',g:24,t:g=>'Porta '+g+' tifosi insieme'},
 {s:'smashed',k:'run',g:8,t:g=>'Distruggi '+g+' ostacoli col fumogeno'},
 {s:'runs',k:'total',g:5,t:g=>'Gioca '+g+' giornate'},
 {s:'noLoss',k:'run',g:600,t:g=>'Fai '+g+' m senza perdere tifosi'},
 {s:'m',k:'run',g:2000,t:g=>'Percorri '+g+' m in una giornata'}];
function getMission(i){const b=MT[i%MT.length],mul=1+Math.floor(i/MT.length)*0.5;let g=Math.round(b.g*mul);if(b.s==='maxCrowd')g=Math.min(g,MAXF-2);return{s:b.s,k:b.k,g,txt:b.t(g)};}
const UNLOCKS=[{n:2,t:'Cappellini granata'},{n:4,t:'Bandierine al vento'},{n:6,t:'Maglia vintage col colletto'},
 {n:8,t:'Tamburo in testa al corteo'},{n:10,t:'Fumogeno di partenza'},{n:12,t:'Corteo di partenza +3'}];
const hasU=i=>save.missionsDone>=UNLOCKS[i].n;

// ---------- contatore collettivo (db condiviso dell'artifact) ----------
let DB=null,UID=null,globalTotal=null,myRemote=0,netState='connessione…',synced=false,pushing=false,pushAgain=false;
async function initNet(){try{
 if(!window.claude||!window.claude.use){netState='solo locale';return;}
 const db=await window.claude.use('db'),user=await window.claude.use('user');
 if(!db||!user){netState='solo locale';return;}
 const id=await user.id();if(!id){netState='solo locale';return;}
 DB=db;UID=id;
 const timer=setTimeout(()=>{if(globalTotal===null)netState='non raggiungibile';},10000);
 db.collection('corteo').onSnapshot(s=>{let t=0;
   for(const d of s.docs){const v=d.data()||{};const n=(typeof v.fans==='number'&&isFinite(v.fans))?clamp(v.fans,0,1e7):0;t+=n;if(d.id===UID)myRemote=n;}
   globalTotal=t;if(!s.metadata.fromCache){netState='online';clearTimeout(timer);}
   if(!synced&&!s.metadata.fromCache){synced=true;if(save.totals.fans>myRemote)setTimeout(pushFans,50);}
  },e=>{clearTimeout(timer);netState='solo locale';});
}catch(e){netState='solo locale';}}
async function pushFans(){if(!DB||!UID||save.totals.fans<=myRemote)return;if(pushing){pushAgain=true;return;}pushing=true;
 try{await DB.collection('corteo').doc(UID).set({fans:save.totals.fans});myRemote=save.totals.fans;}
 catch(e){if(e&&e.code==='invalid_argument')netState='sola lettura';}
 pushing=false;if(pushAgain){pushAgain=false;pushFans();}}
setTimeout(initNet,0);
const collective=()=>globalTotal!==null?Math.max(globalTotal,save.totals.fans):save.totals.fans;

// ---------- dati di gioco ----------
const ZONES=[{name:'VIA ROMA',obs:['giornali','soldi','coppa','tele']},
 {name:'VIA FILADELFIA',obs:['giornali','soldi','tele','sagoma','lavori']},
 {name:'STADIO GRANDE TORINO',obs:['giornali','coppa','tele','sagoma','lavori','tornello']}];
const OBST={giornali:{w:56,h:38,th:1},soldi:{w:42,h:44,th:1},coppa:{w:40,h:54,th:1},tele:{w:40,h:50,th:1},
 sagoma:{w:32,h:58},lavori:{w:74,h:40},tornello:{w:36,h:150,gate:1}};
const SKINS=['#f6d2b0','#eab48a','#d39a6a','#a8693f','#7a4a2a'];
const SHIRTS=[GRANATA,GRANATA,'#7a1520',GRANATA,'#f4f4f4'];
const HAIRS=['#3a2414','#6b4423','#1a1a1a','#d8a840','#b0b0b0','#8a3a1a'];
const BANNERS=['CAIRO VATTENE','VENDI IL TORO','IL TORO NON SI SVENDE','RIDATECI IL TORO','LIBERATE IL TORO','IL TORO È DEI TIFOSI'];
const CHANTS=['CAIRO VATTENE!','VATTENE!','VENDI IL TORO!','RIDATECI IL TORO!','LIBERATE IL TORO!','CAIRO VATTENE!'];
const CAPS=[8,7,6,5,4,3,2,1],SLOTS=[];
CAPS.forEach((c,r)=>{for(let i=0;i<c;i++)SLOTS.push({dx:-i*18-r*9,dy:-r*28,row:r});});
const DRAWORDER=SLOTS.map((s,k)=>k).sort((a,b)=>SLOTS[b].row-SLOTS[a].row||SLOTS[a].dx-SLOTS[b].dx);

// città
const PAL=['#f2c46d','#e8956b','#e9b765','#f4dca0','#d98a5f','#f0d28a','#e7a97a'];
const BLD=[];let bx=0;
while(bx<1500){const w=(R(84,130))|0,h=(R(125,180))|0,c=pick(PAL);
 BLD.push({x:bx,w,h,c,cL:shade(c,.18),cD:shade(c,-.12),rows:Math.floor((h-46)/30),cols:Math.max(2,Math.floor((w-16)/24)),
  bal:(Math.random()*3)|0,flag:Math.random()<.5,fr:(Math.random()*2)|0,fc:(Math.random()*2)|0,banner:Math.random()<.45?pick(BANNERS):null});
 bx+=w+((R(2,8))|0);}
const BLDW=bx;
const CLOUDS=[];for(let i=0;i<6;i++)CLOUDS.push({x:i*190+R(0,80),y:R(25,90),s:R(.7,1.3)});

// ---------- stato ----------
let state='menu',dist=0,spd=150,camX=0,T=0,shake=0,overT=0,seasonRes=null;
let fans=[],lost=[],obs=[],picks=[],parts=[],floats=[],gap=300,chantT=1,bubble=null,power=0,banner=null;
let cairo,heli=null,heliEv=null,nextHeli=800,zone=-1,landmark=null,run=null,runDone=[];
let BTN=[];

function mkFan(x){const sh=pick(SHIRTS);
 const f={x,oy:0,jy:0,vy:0,q:[],ph:Math.random()*10,skin:pick(SKINS),shirt:sh,scarf:sh==='#f4f4f4'?GRANATA:'#fff',
  hat:Math.random()<(hasU(0)?.6:.25),hatc:hasU(0)?GRANATA:pick([GRANATA,'#fff','#222']),hair:pick(HAIRS),collar:hasU(2),flag:hasU(1)&&Math.random()<.3};
 f.shirtL=shade(f.shirt,.28);f.shirtD=shade(f.shirt,-.3);f.skinL=shade(f.skin,.3);f.skinD=shade(f.skin,-.22);f.hairL=shade(f.hair,.35);f.hatL=shade(f.hatc,.3);
 return f;}
function mkCairo(){return{x:500,y:GY,vy:0,running:true,hidden:false,climb:false,throwT:0};}
function demoSetup(){fans=[];for(let k=0;k<14;k++){const f=mkFan(LEADX+SLOTS[k].dx);f.oy=SLOTS[k].dy;fans.push(f);}cairo=mkCairo();obs=[];picks=[];heli=null;heliEv=null;bubble=null;power=0;landmark=null;}
demoSetup();

function startRun(){
 state='play';dist=0;fans=[];const n=hasU(5)?8:5;
 for(let k=0;k<n;k++)fans.push(mkFan(LEADX+SLOTS[k].dx));
 lost=[];obs=[];picks=[];parts=[];floats=[];gap=420;chantT=1.5;bubble=null;power=hasU(4)?3:0;
 cairo=mkCairo();heli=null;heliEv=null;nextHeli=800;zone=-1;landmark=null;runDone=[];
 run={m:0,maxCrowd:n,gates:0,smokes:0,heliWin:0,smashed:0,picked:0,noLoss:0,lossAt:0};
 banner={t:'GIORNATA '+(save.giornata+1)+' / '+GIORNATE,sub:'Stagione '+save.season,life:2.2};beep(660,.1);
}

// ---------- input ----------
function jump(){const ld=fans[0];if(!ld||ld.jy<-0.5)return;
 for(const f of fans){const d=Math.max(0,LEADX-f.x)/Math.max(spd,1);f.q.push(T+d);}
 beep(520,0.06,'square',0.025);}
function toGame(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/SC,y:(e.clientY-r.top)/SC};}
addEventListener('pointerdown',e=>{e.preventDefault();
 if(state==='play'){jump();return;}
 const p=toGame(e);for(const b of BTN){if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){beep(700,.06);b.fn();return;}}
},{passive:false});
addEventListener('keydown',e=>{if(!['Space','ArrowUp','KeyW','Enter'].includes(e.code))return;e.preventDefault();if(e.repeat)return;
 if(state==='play')jump();else if(state==='menu')startRun();else if(state==='over'&&overT>0.8)afterOver(true);else if(state==='season')endSeason();else if(state==='unlocks')state='menu';});

// ---------- missioni ----------
function completeMission(slot){const i=save.active[slot],m=getMission(i);
 save.missionsDone++;save.active[slot]=save.nextM++;delete save.mprog[i];runDone.push(m.txt);
 banner={t:'MISSIONE COMPLETATA!',sub:m.txt,life:2.6};fanfare();
 const u=UNLOCKS.find(u=>u.n===save.missionsDone);if(u)setTimeout(()=>{banner={t:'SBLOCCATO!',sub:u.t,life:2.8};fanfare();},2700);
 persist();}
function checkRunMissions(){for(let s=0;s<3;s++){const m=getMission(save.active[s]);if(m.k==='run'&&run[m.s]>=m.g)completeMission(s);}}
function missionProgress(slot){const i=save.active[slot],m=getMission(i);
 if(m.k==='total')return Math.min(m.g,save.mprog[i]||0);if(state==='play'||state==='over')return Math.min(m.g,Math.floor(run?run[m.s]:0));return 0;}

function finishRun(){
 const P=Math.floor(run.m)+run.picked*10+run.gates*100+run.heliWin*300+run.smashed*20;run.P=P;
 save.giornata++;save.seasonP+=P;save.totals.runs++;save.totals.fans+=run.picked;save.best=Math.max(save.best,Math.floor(run.m));
 for(let s=0;s<3;s++){const i=save.active[s],m=getMission(i);if(m.k==='total'){save.mprog[i]=(save.mprog[i]||0)+(m.s==='picked'?run.picked:1);if(save.mprog[i]>=m.g)completeMission(s);}}
 seasonRes=save.seasonP>=seasonTarget()?'win':(save.giornata>=GIORNATE?'lose':null);
 persist();pushFans();state='over';overT=0;}
function afterOver(replay){if(seasonRes){state='season';overT=0;parts=[];return;}if(replay)startRun();else{state='menu';demoSetup();}}
function endSeason(){if(seasonRes==='win')save.seasonWins++;save.season++;save.giornata=0;save.seasonP=0;seasonRes=null;persist();state='menu';demoSetup();}

// ---------- spawn ----------
function spawn(){
 const z=run.m>1800?2:zone,pool=ZONES[z].obs,r=Math.random(),k2=spd/210;
 const canThrow=!heliEv&&!cairo.hidden;
 if(r<0.45){
  let k=pick(pool);const t0=OBST[k];
  if(t0.th&&!canThrow){gap=60;return;}
  const t=OBST[k];
  if(t.th){obs.push({k,w:t.w,h:t.h,x:cairo.x-t.w/2,y:cairo.y-40,vy:-300,rot:0,landed:false});cairo.throwT=0.35;beep(300,.08,'triangle',.03);gap=R(320,430)*k2;}
  else if(t.gate){obs.push({k,w:t.w,h:t.h,x:W+30,y:GY,landed:true,gate:true,need:clamp(Math.round(8+run.m/150),6,MAXF-4)});gap=R(400,480)*k2;}
  else{obs.push({k,w:t.w,h:t.h,x:W+30,y:GY,landed:true});gap=R(330,440)*k2;}
 }else if(r<0.78){const n=1+((Math.random()*3)|0);for(let i=0;i<n;i++)picks.push({type:'fan',x:W+30+i*24,y:GY,f:mkFan(0)});gap=R(140,210)*k2;}
 else if(r<0.9){picks.push({type:'flag',x:W+30,y:GY-70,v:3});gap=R(170,230)*k2;}
 else if(r<0.955){picks.push({type:'drum',x:W+30,y:GY-88,v:5});gap=R(180,240)*k2;}
 else{picks.push({type:'smoke',x:W+30,y:GY-80});gap=R(200,260)*k2;}
}
function addFloat(x,y,t,c,s){floats.push({x,y,t,c:c||'#fff',life:1.1,s:s||22});}
function burst(x,y,cols,n,sp){for(let i=0;i<n;i++){const a=R(0,Math.PI*2),v=R(40,sp||160);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-40,life:R(.5,1),c:pick(cols),r:R(2,4)});}}
function loseFan(i,f,fy){fans.splice(i,1);lost.push({x:f.x,y:fy,vx:R(-160,-80),vy:R(-380,-240),f,life:1.3,rot:0});run.lossAt=run.m;shake=.15;beep(140,.12,'sawtooth',.03);}

// ---------- update ----------
function updFans(dt){
 for(let i=0;i<fans.length;i++){const f=fans[i],s=SLOTS[Math.min(i,SLOTS.length-1)];
  f.x+=(LEADX+s.dx-f.x)*Math.min(1,dt*5);f.oy+=(s.dy-f.oy)*Math.min(1,dt*7);
  if(f.q.length&&T>=f.q[0]){f.q.shift();if(f.jy>=-0.5)f.vy=JV;}
  f.vy+=G*dt;f.jy+=f.vy*dt;if(f.jy>0){f.jy=0;f.vy=0;}}
 if(spd>20&&fans.length&&Math.random()<dt*14){const f=fans[(Math.random()*Math.min(8,fans.length))|0];if(f.jy===0&&f.oy>-2)parts.push({x:f.x-6,y:GY-2,vx:R(-80,-30),vy:R(-30,-5),life:.5,c:'rgba(200,190,170,.5)',r:R(3,5),smoke:1});}
}
function updCairo(dt){
 const c=cairo;c.throwT=Math.max(0,c.throwT-dt);
 if(!c.hidden&&(state==='play'||state==='menu')&&!(heliEv&&heliEv.ph>0)){
  const tx=490+Math.min(fans.length,MAXF)*1.6+Math.sin(T*1.3)*14;c.x+=(tx-c.x)*Math.min(1,dt*1.5);
  for(const p of picks){const d=p.x-(c.x+8);if(p.type==='fan'&&d>0&&d<30&&c.y>=GY-0.5)c.vy=JV*0.9;}
  for(const o of obs){const d=o.x-(c.x+10);if(o.landed&&!o.gate&&d>0&&d<34&&c.y>=GY-0.5)c.vy=JV;}
  if(fans.length>12&&Math.random()<dt*4)parts.push({x:c.x+R(-6,10),y:c.y-62,vx:R(-30,30),vy:R(-90,-30),life:.6,c:'#7fd4ff',r:2.5});}
 if(!c.climb&&!c.hidden){c.vy+=G*dt;c.y+=c.vy*dt;if(c.y>GY){c.y=GY;c.vy=0;}}
 c.running=spd>5;}
const hit=(ax,ay,aw,ah,bx,by,bw,bh)=>ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;

function updHeliEvent(dt){
 const e=heliEv,c=cairo;e.t+=dt;
 if(e.ph===0){heli.x+=(c.x+6-heli.x)*Math.min(1,dt*1.6);heli.y+=((GY-140)-heli.y)*Math.min(1,dt*1.6);
  if(e.t>3.6){if(fans.length>=e.need||power>0){e.ph=1;run.heliWin++;addFloat(heli.x,heli.y+60,'RESPINTO! +300','#8f8',26);bubble={t:'VATTENE!!',life:2};burst(heli.x,heli.y,['#fff',GRANATA,'#ffd84a'],30,220);fanfare();}
   else{e.ph=2;c.hidden=true;addFloat(c.x,GY-120,'È SCAPPATO...','#ffd84a',24);beep(200,.3,'triangle',.04);}e.t=0;}}
 else if(e.ph===1){heli.x+=200*dt;heli.y-=150*dt;if(e.t>2.2)endHeli();}
 else if(e.ph===2){heli.x+=220*dt;heli.y-=60*dt;if(e.t>2.4){e.ph=3;e.t=0;heli.x=W+80;heli.y=GY-160;}}
 else if(e.ph===3){heli.x+=(500-heli.x)*Math.min(1,dt*2);if(e.t>1.6){c.hidden=false;c.x=heli.x;c.y=GY-110;c.vy=0;addFloat(c.x,GY-150,'...MA TORNA!','#fff',20);e.ph=4;e.t=0;}}
 else if(e.ph===4){heli.x+=200*dt;heli.y-=120*dt;if(e.t>1.5)endHeli();}}
function endHeli(){heliEv=null;heli=null;nextHeli=run.m+900;}

function update(dt){
 T+=dt;shake=Math.max(0,shake-dt);
 if(banner){banner.life-=dt;if(banner.life<=0)banner=null;}
 power=Math.max(0,power-dt);
 if(power>0&&fans.length&&Math.random()<dt*22){const f=pick(fans);parts.push({x:f.x+R(-6,6),y:GY+f.oy+f.jy-R(10,40),vx:R(-160,-60),vy:R(-80,-20),life:R(.5,1),c:pick(['rgba(200,30,40,.45)','rgba(150,20,30,.4)','rgba(230,80,80,.4)']),r:R(5,10),smoke:1});}
 if(state==='menu'||state==='unlocks'){spd=150;camX+=spd*dt;updFans(dt);updCairo(dt);if(Math.random()<dt*.5)jump();updParticles(dt);return;}
 if(state==='season'){overT+=dt;camX+=60*dt;updFans(dt);
  if(seasonRes==='win'&&Math.random()<dt*3){burst(R(60,580),R(40,150),[GRANATA,'#fff','#ffd84a'],30,200);beep(R(200,420),.15,'triangle',.03);}
  updParticles(dt);return;}
 if(state==='over'){overT+=dt;spd=Math.max(0,spd-200*dt);}
 if(state==='play'){
  spd=(210+Math.min(170,run.m*0.07))*(power>0?1.15:1);dist+=spd*dt;run.m=dist/10;
  run.noLoss=Math.max(run.noLoss,run.m-run.lossAt);run.maxCrowd=Math.max(run.maxCrowd,fans.length);
  const z=Math.floor(run.m/600)%3;if(z!==zone){zone=z;if(run.m>5)banner={t:ZONES[z].name,life:2};landmark=z?{k:z,x:W+260}:null;}
  gap-=spd*dt;if(gap<=0)spawn();
  if(!heliEv&&run.m>=nextHeli){heliEv={ph:0,t:0,need:clamp(Math.round(8+run.m/110),8,MAXF-2)};heli={x:W+90,y:-50};banner={t:'ELICOTTERO IN ARRIVO!',sub:'Servono '+heliEv.need+' tifosi per respingerlo',life:3};beep(250,.3,'sawtooth',.04);}
  if(heliEv)updHeliEvent(dt);

  text('Cairo resta. Nuova stagione, stessa protesta.',W/2,210,13,'#7a5a30','center',null);}
 button(W/2-110,272,220,46,'NUOVA STAGIONE',endSeason,GRANATA,20);}

function draw(){
 BTN=[];ctx.setTransform(SC*DPR,0,0,SC*DPR,0,0);
 if(shake>0)ctx.translate(R(-3,3),R(-3,3));
 drawBg();
 for(const p of picks)drawPick(p);
 for(const o of obs)drawObs(o);
 for(const p of parts)if(p.smoke){circ(p.x,p.y,p.r);ctx.fillStyle=p.c;ctx.fill();}
 for(const l of lost)drawFan({...l.f,jy:-5},l.x,l.y,false,l.rot);
 for(const f of fans)if(f.oy>-6)shadow(f.x+1,GY+1,11*clamp(1+f.jy/160,.4,1),.22);
 for(const k of DRAWORDER){if(k>=fans.length)continue;const f=fans[k];drawFan(f,f.x,GY+f.oy+f.jy,state==='season'&&Math.floor(T*3+k)%2===0,0,1,k===0);}
 if(cairo&&state!=='season')drawCairo();
 if(heli&&state!=='season')drawHeli(heli,null,heliEv&&heliEv.ph===0&&heliEv.t>1.5);
 for(const p of parts){if(p.smoke)continue;ctx.globalAlpha=Math.min(1,p.life*2);circ(p.x,p.y,p.r||3);ctx.fillStyle=p.c;ctx.fill();}ctx.globalAlpha=1;
 drawForeground();
 for(const f of floats){ctx.globalAlpha=Math.min(1,f.life*2);text(f.t,f.x,f.y,f.s,f.c,'center');}ctx.globalAlpha=1;
 if(bubble&&fans.length&&state==='play'){const top=fans.reduce((m,f)=>Math.min(m,GY+f.oy+f.jy),GY);const x=Math.max(110,LEADX-50),y=Math.max(90,top-110);
  ctx.font='20px '+F;const w=ctx.measureText(bubble.t).width+28;
  rr(x-w/2,y,w,36,16);fs('#fff',3);ctx.beginPath();ctx.moveTo(x-6,y+35);ctx.lineTo(x+4,y+50);ctx.lineTo(x+10,y+35);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle=OUT;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x-6,y+36);ctx.lineTo(x+4,y+50);ctx.lineTo(x+10,y+36);ctx.stroke();
  text(bubble.t,x,y+26,20,GRANATA,'center',null);}
 // vignetta
 const vg=ctx.createRadialGradient(W/2,H/2,H*0.45,W/2,H/2,H*0.95);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(30,0,5,.35)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
 ctx.setTransform(SC*DPR,0,0,SC*DPR,0,0);
 if(state==='play'||state==='over')drawHud();
 if(banner&&(state==='play')){ctx.globalAlpha=Math.min(1,banner.life*2);text(banner.t,W/2,132,32,'#fff','center',GRANATA,8);if(banner.sub)text(banner.sub,W/2,156,15,'#ffd84a','center',OUT,4);ctx.globalAlpha=1;}
 if(state==='menu')drawMenu();
 if(state==='unlocks')drawUnlocks();
 if(state==='over')drawOver();
 if(state==='season')drawSeason();
 if((state==='menu')&&innerHeight>innerWidth)text('↻ gira il telefono',W/2,H-30,14,'#fff','center');
}

let last=performance.now();
function loop(now){const dt=Math.min(0.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
})();
</script>
